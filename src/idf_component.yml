# ESP-IDF managed components for Daemon.
#
# The IDF Component Manager pulls these at first build from
# https://components.espressif.com. Keeping the list here (instead of vendoring
# sources) means `pio run` stays reproducible and we can upgrade LVGL et al.
# by bumping a single version.
dependencies:
  idf: ">=5.1"
  lvgl/lvgl:                       "^9.2.0"
  espressif/esp_lvgl_port:         "^2.4.0"
  espressif/esp_lcd_touch:         "^1.1.2"
  # BOX-3 touch IC. The actual hardware on this device is GT911 — confirmed
  # at first bring-up via I2C scan once the LCD/touch reset polarity bug
  # was fixed (see display.c).
  espressif/esp_lcd_touch_gt911:   "~1.1.3"
  # ILI9342C driver (covers ILI9341 + ILI9342). Replaces the built-in
  # ST7789 wiring used by the Waveshare panel.
  espressif/esp_lcd_ili9341:       "^2.0.0"
