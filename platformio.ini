; =============================================================================
; Daemon — ESP-IDF build for the Waveshare ESP32-S3-Touch-LCD-2.8
;
; This is the migration branch. We dropped the Arduino framework entirely so
; every subsystem speaks the same ESP-IDF API (esp_http_client, esp_lcd,
; esp_wifi, lvgl, eventually esp-sr for wake-word). Pin assignments match
; the Arduino build so the hardware we already know works keeps working.
;
; Layout:
;   platformio.ini         — this file
;   sdkconfig.defaults     — board-wide IDF config (PSRAM, flash, CDC, etc.)
;   partitions.csv         — 16 MB layout: app + littlefs
;   src/CMakeLists.txt     — IDF "main" component declaration
;   src/app_main.c         — entry point
;   src/idf_component.yml  — managed-component deps (LVGL, esp_lvgl_port, …)
; =============================================================================

[env:waveshare_esp32s3_28]
platform        = espressif32 @ ^6.8.0
board           = esp32-s3-devkitc-1
framework       = espidf
monitor_speed   = 115200
upload_speed    = 921600

; Let the ESP32-S3 native USB-Serial/JTAG flip into download mode automatically
; so we don't have to hold BOOT/reset when flashing.
board_upload.before_reset = usb_reset
board_upload.after_reset  = hard_reset

; 16 MB flash, 8 MB PSRAM. flash_size / partitions come through sdkconfig.
board_build.flash_size    = 16MB
board_build.partitions    = partitions.csv
board_upload.flash_size   = 16MB
