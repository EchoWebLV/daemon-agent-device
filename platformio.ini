; =============================================================================
; Daemon — ESP-IDF build for the Espressif ESP32-S3-BOX-3B.
;
; Migrated from the Waveshare ESP32-S3-Touch-LCD-2.8 in 2026-04. ESP-IDF only
; (no Arduino), so every subsystem speaks the same API: esp_http_client,
; esp_lcd, esp_wifi, lvgl, eventually esp-sr for wake-word. Pin assignments
; live in src/board.h, sourced from Espressif's official esp-bsp BOX-3 source.
;
; Layout:
;   platformio.ini         — this file
;   sdkconfig.defaults     — board-wide IDF config (Octal PSRAM, flash, CDC)
;   partitions.csv         — 16 MB layout: app + littlefs
;   src/CMakeLists.txt     — IDF "main" component declaration
;   src/board.h            — single source of truth for all GPIOs
;   src/app_main.c         — entry point
;   src/idf_component.yml  — managed-component deps (LVGL, esp_lvgl_port, …)
; =============================================================================

[env:esp32_s3_box_3b]
platform        = espressif32 @ ^6.8.0
board           = esp32-s3-devkitc-1
framework       = espidf
monitor_speed   = 115200
upload_speed    = 921600

; Let the ESP32-S3 native USB-Serial/JTAG flip into download mode automatically
; so we don't have to hold BOOT/reset when flashing.
board_upload.before_reset = usb_reset
board_upload.after_reset  = hard_reset

; 16 MB flash, 8 MB PSRAM. flash_size / partitions come through sdkconfig.
board_build.flash_size    = 16MB
board_build.partitions    = partitions.csv
board_upload.flash_size   = 16MB

; Static assets are embedded via a PlatformIO pre-build hook that converts
; each file into a regular C source exposing `<sym>_start[]` / `<sym>_len`.
; Why not the built-in options: both CMake's EMBED_TXTFILES (in
; src/CMakeLists.txt) and PIO's board_build.embed_txtfiles generate the
; intermediate .S at a path PIO's ESP-IDF SCons integration then fails to
; re-resolve (target prefix ends up doubled), so the linker can't find
; _binary_index_html_start. The pre-build script sidesteps SCons entirely
; by just emitting normal C. See scripts/embed_assets.py.
extra_scripts =
    pre:scripts/embed_assets.py
