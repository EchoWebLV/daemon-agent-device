; PlatformIO project for Waveshare ESP32-S3-Touch-LCD-2.8
; "Blue Gremlin" — an animated creature you can chat with, powered by Gemini.

[env:waveshare_esp32s3_28]
platform        = espressif32 @ ^6.8.0
board           = esp32-s3-devkitc-1
framework       = arduino
monitor_speed   = 115200
upload_speed    = 921600

; Force the ESP32-S3 native USB-Serial/JTAG into download mode even while
; user firmware is running, so we don't have to press BOOT/RESET manually.
board_upload.before_reset = usb_reset
board_upload.after_reset  = hard_reset

; This board has 8 MB PSRAM + 16 MB Flash. Enable both.
board_build.flash_size    = 16MB
board_build.partitions    = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size   = 16MB

build_flags =
    ; ---- USB CDC (Serial) over the native USB port -----------------
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; ---- PSRAM -----------------------------------------------------
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_USE_CAPS_ALLOC=1

    ; ---- TFT_eSPI configuration (ST7789, 240x320, SPI) -------------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=45
    -DTFT_SCLK=40
    -DTFT_CS=42
    -DTFT_DC=41
    -DTFT_RST=39
    -DTFT_BL=5
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_GFXFF=1
    ; ST7789 on this board runs cleanly at 80 MHz SPI; doubling the rate
    ; halves the full-sprite push time from ~30 ms to ~15 ms.
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000

    ; ---- Bigger default TLS record buffer so Gemini responses fit --
    -DCONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=16384
    -DCONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=4096

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/CIRCUITSTATE/CSE_Touch.git
    https://github.com/CIRCUITSTATE/CSE_CST328.git
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6

extra_scripts =
    pre:patches/audio_elevenlabs_patch.py
