[package]
name = "agent_program"
version = "0.1.0"
description = "On-chain vault for the daemon device"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agent_program"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed not used (we only `init`); dropping the feature shrinks
# the bytecode by a few KB after LTO.
anchor-lang = { version = "0.32.1" }
anchor-spl  = { version = "0.32.1", features = ["token"] }
