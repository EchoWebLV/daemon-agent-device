[toolchain]
anchor_version = "0.32.1"

[features]
resolution = true
skip-lint = false

[programs.devnet]
agent_program = "9DJqU25ShsEXNisbzSNUPzaN6qiSbU9XiNL7eerqYPFf"

[programs.mainnet]
agent_program = "9DJqU25ShsEXNisbzSNUPzaN6qiSbU9XiNL7eerqYPFf"

[programs.localnet]
agent_program = "9DJqU25ShsEXNisbzSNUPzaN6qiSbU9XiNL7eerqYPFf"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 60000
shutdown_wait = 2000

[test.validator]
rpc_port = 8899
